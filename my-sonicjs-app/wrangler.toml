name = "my-sonicjs-app"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account
account_id = "177aa484a66427793543c5e958f8d020"

# Cloudflare Workers settings
workers_dev = true

# D1 Database
# Note: database_name and database_id are automatically updated by GitHub Actions
[[d1_databases]]
binding = "DB"
database_name = "sonicjs-prod"
database_id = "3753cac0-55dd-4edf-bfa4-6519937db5f4"
migrations_dir = "./migrations"

# R2 Bucket for media storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media-prod"

# KV Cache
[[kv_namespaces]]
binding = "CACHE_KV"
id = "8546a637323a4584809c1da1d34373f0"

# Environment variables
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "http://localhost:8787"
# MEDIA_PUBLIC_BASE_URL / BUCKET_NAME are NOT set here on purpose — keep them out of version control.
# Local dev:   put them in my-sonicjs-app/.dev.vars (see .dev.vars.example)
# Production:   set them as Worker environment variables (Cloudflare dashboard) or `wrangler secret put`

# Observability
[observability]
enabled = true
